# /etc/nginx/sites-available/warbyte-ws — oyunun WebSocket bağlantısı Cloudflare'siz (DNS only, gri bulut): ws.warbyte.io → 8787.
# Cloudflare'in ücretsiz planı Türkiye trafiğini Amsterdam'dan dolaştırıyordu (TR sunucuya ping ~138 ms, doğrudan ~32 ms).
# TLS: certbot --nginx -d ws.warbyte.io --redirect
server {
    listen 80;
    listen [::]:80;
    server_name ws.warbyte.io;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
