# /etc/nginx/sites-available/warbyte-admin — admin paneli: yalnız bu alt alan adı, Node içindeki 127.0.0.1:8788 admin sunucusuna gider.
# Cloudflare'de A kaydı: admin → sunucu IP (proxied). TLS: certbot --nginx -d admin.warbyte.site --redirect
server {
    listen 80;
    listen [::]:80;
    server_name admin.warbyte.site;

    client_max_body_size 512k;
    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
