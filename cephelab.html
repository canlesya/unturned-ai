<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cephe Laboratuvarı</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1c1e1f;font-family:Bahnschrift,'Arial Narrow',Arial,sans-serif;color:#e8e6df}
canvas{display:block}
#labels{position:fixed;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,0);text-align:center;white-space:nowrap;text-shadow:0 1px 3px #000}
.lbl b{display:block;font-size:17px;letter-spacing:1.5px;text-transform:uppercase}
.lbl span{display:block;font-size:12px;opacity:.75;letter-spacing:.5px;margin-top:2px}
#title{position:fixed;left:24px;top:16px;font-size:24px;letter-spacing:3px;text-transform:uppercase;font-weight:700}
#title small{display:block;font-size:12px;letter-spacing:1.5px;opacity:.65;font-weight:400;margin-top:3px;text-transform:none}
</style>
</head>
<body>
<div id="title"></div>
<div id="labels"></div>
<script type="module" src="/src/cephelab/main.js"></script>
</body>
</html>
