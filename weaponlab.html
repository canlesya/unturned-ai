<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Silah Laboratuvarı</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0c0f; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #hud { position: fixed; left: 10px; top: 8px; color: #fff; font-size: 14px; background: rgba(0,0,0,.5); padding: 5px 9px; border-radius: 6px; }
    #labels { position: fixed; inset: 0; pointer-events: none; }
    .lbl { position: absolute; color: #e8ecf2; font-size: 13px; white-space: nowrap; letter-spacing: .3px; }
    .lbl.top { transform: translate(-50%, -100%); font-size: 15px; font-weight: 600; }
    .lbl.left { transform: translate(0, 0); color: #9aa3b0; }
    .lbl.dark { color: #fff; background: rgba(0,0,0,.55); padding: 3px 7px; border-radius: 5px; font-size: 13px; font-weight: 500; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="labels"></div>
  <script type="module" src="/src/weaponlab/main.js"></script>
</body>
</html>
