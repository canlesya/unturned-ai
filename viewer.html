<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Model Önizleme</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1c1f26; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #labels { position: fixed; inset: 0; pointer-events: none; }
    .lbl { position: absolute; transform: translate(-50%, 0); color: #fff; text-align: center; white-space: nowrap;
           text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 8px rgba(0,0,0,.6); }
    .lbl b { display: block; font-size: 15px; letter-spacing: .2px; }
    .lbl span { display: block; font-size: 11.5px; opacity: .8; }
    #title { position: fixed; left: 18px; top: 14px; color: #fff; font-size: 20px; font-weight: 700;
             text-shadow: 0 1px 4px rgba(0,0,0,.8); }
    #title small { display: block; font-size: 12px; font-weight: 400; opacity: .8; margin-top: 2px; }
    #nav { position: fixed; right: 14px; top: 12px; display: flex; gap: 6px; }
    #nav a { color: #fff; background: rgba(0,0,0,.45); padding: 6px 10px; border-radius: 6px; font-size: 13px; text-decoration: none; }
    #nav a.on { background: #2f6fdb; }
  </style>
</head>
<body>
  <div id="labels"></div>
  <div id="title"></div>
  <div id="nav"></div>
  <script type="module" src="/src/viewer/viewer.js"></script>
</body>
</html>
